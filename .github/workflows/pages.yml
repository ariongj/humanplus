# Builds and checks the site on every push. On the default branch the built preview is published to the
# `gh-pages` branch, which GitHub Pages serves at https://<user>.github.io/<repo>/ (noindex, so it never
# competes with humanplusks.com in search). No Pages settings change is needed for this.
# The production site (humanplusks.com) is built with SITE_URL=https://humanplusks.com — see README → Publishing.
name: Build, check and publish

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (preview under /${{ github.event.repository.name }}/, noindex)
        run: node scripts/build.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Check pages (links, anchors, titles, hreflang, JSON-LD)
        run: node scripts/check.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to the gh-pages branch
        if: github.ref_name == github.event.repository.default_branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
