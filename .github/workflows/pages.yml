# Builds and checks the site on every push. On the default branch the built preview is published to the
# `gh-pages` branch, which GitHub Pages serves at https://<user>.github.io/<repo>/ (noindex, so it never
# competes with humanplusks.com in search). No Pages settings change is needed for this.
# A second version with real photos (src/variants/re/photos/) is published under /<repo>/re/ when it has photos.
# The production site (humanplusks.com) is built with SITE_URL=https://humanplusks.com — see README → Publishing.
name: Build, check and publish

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (preview under /${{ github.event.repository.name }}/, noindex)
        run: node scripts/build.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Check pages (links, anchors, titles, hreflang, JSON-LD)
        run: node scripts/check.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Build and check the photo version under /re/ (only when src/variants/re/photos/ has photos)
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if ls src/variants/re/photos/ 2>/dev/null | grep -qiE '\.(jpe?g|webp|png|avif)$'; then
            OUT_DIR=dist/re PHOTOS_DIR=src/variants/re/photos BASE_PATH=/$REPO/re/ SITE_URL=https://$OWNER.github.io node scripts/build.mjs
            OUT_DIR=dist/re BASE_PATH=/$REPO/re/ node scripts/check.mjs
          else
            echo "No photos in src/variants/re/photos/ yet: the /re/ version is not built."
          fi

      # Each publish is a new commit on top of the live one, so the previous deployment stays in the gh-pages
      # history as the rollback point (README → Publishing → Rollback). Only changed files add to the branch.
      - name: Publish to the gh-pages branch
        if: github.ref_name == github.event.repository.default_branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth=1 "$REMOTE" gh-pages; then
            git reset -q --soft FETCH_HEAD
            echo "Previous deployment (rollback point): $(git rev-parse --short FETCH_HEAD)"
          fi
          git add -A
          git commit -q --allow-empty -m "Publish ${GITHUB_SHA::7}"
          git push -q "$REMOTE" HEAD:gh-pages
