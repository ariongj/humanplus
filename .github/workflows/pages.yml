# Builds and checks the site on every push. The default branch is also published to GitHub Pages as a preview
# under https://<user>.github.io/<repo>/ (noindex, so it never competes with humanplusks.com in search).
# The production site (humanplusks.com) is built with SITE_URL=https://humanplusks.com — see README → Publishing.
name: Build, check and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (preview under /${{ github.event.repository.name }}/, noindex)
        run: node scripts/build.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Check pages (links, anchors, titles, hreflang, JSON-LD)
        run: node scripts/check.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5

      - if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
